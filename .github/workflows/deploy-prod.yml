name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing GHCR image tag to deploy, for example main-<commit-sha>"
        required: true
        type: string

env:
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  # ── Deploy an existing, already scanned image on the server ───────
  deploy:
    name: Deploy to nosblindtests.fr
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v6

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            deploy_root=/opt/blindtest/prod
            stale_path="$deploy_root/infra/minio/init.sh"

            # A failed/old SCP extraction can leave this path root-owned or as
            # a directory. Remove the exact stale path before the next upload.
            sudo rm -rf -- "$stale_path"
            sudo install -d -o "$(id -un)" -g "$(id -gn)" \
              "$deploy_root/infra/minio"

      - name: Copy Compose and MinIO init script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          source:   docker-compose.yml,infra/minio/init.sh
          target:   /opt/blindtest/prod

      - name: Write .env, pull images and restart
        uses: appleboy/ssh-action@v1
        env:
          POSTGRES_PASSWORD:              ${{ secrets.PROD_POSTGRES_PASSWORD }}
          JWT_SECRET:                     ${{ secrets.PROD_JWT_SECRET }}
          RESEND_API_KEY:                 ${{ secrets.PROD_RESEND_API_KEY }}
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.PROD_CLOUDFLARE_TURNSTILE_SECRET_KEY }}
          S3_ACCESS_KEY:                  ${{ secrets.PROD_S3_ACCESS_KEY }}
          S3_SECRET_KEY:                  ${{ secrets.PROD_S3_SECRET_KEY }}
          YOUTUBE_COOKIES_B64:            ${{ secrets.PROD_YOUTUBE_COOKIES_B64 }}
          GHCR_TOKEN:                     ${{ secrets.GHCR_TOKEN }}
        with:
          host:     ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          envs:     POSTGRES_PASSWORD,JWT_SECRET,RESEND_API_KEY,CLOUDFLARE_TURNSTILE_SECRET_KEY,S3_ACCESS_KEY,S3_SECRET_KEY,YOUTUBE_COOKIES_B64,IMAGE_TAG,GHCR_TOKEN
          script: |
            set -e
            cd /opt/blindtest/prod
            test -f infra/minio/init.sh
            backend_image="ghcr.io/cyprienj/blindtest-backend:${IMAGE_TAG}"
            frontend_image="ghcr.io/cyprienj/blindtest-frontend:${IMAGE_TAG}"

            install -d -m 711 secrets
            rm -f secrets/youtube-cookies.txt
            if [ -n "${YOUTUBE_COOKIES_B64}" ]; then
              umask 077
              printf '%s' "${YOUTUBE_COOKIES_B64}" \
                | base64 --decode > secrets/youtube-cookies.txt
              if ! grep -Eq '^# (Netscape )?HTTP Cookie File\r?$' \
                secrets/youtube-cookies.txt; then
                echo 'Decoded YouTube cookies are not in Netscape format.' >&2
                rm -f secrets/youtube-cookies.txt
                exit 1
              fi
            fi

            # Write production .env from secrets
            cat > .env << EOF
            POSTGRES_DB=blindtest_prod
            POSTGRES_USER=blindtest_prod
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            RESEND_API_KEY=${RESEND_API_KEY}
            CLOUDFLARE_TURNSTILE_SECRET_KEY=${CLOUDFLARE_TURNSTILE_SECRET_KEY}
            S3_ENDPOINT=http://minio:9000
            S3_PUBLIC_ENDPOINT=https://media.nosblindtests.fr
            S3_REGION=us-east-1
            S3_BUCKET=blindtest-media
            S3_ACCESS_KEY=${S3_ACCESS_KEY}
            S3_SECRET_KEY=${S3_SECRET_KEY}
            APP_BASE_URL=https://nosblindtests.fr
            APP_PORT=8090
            BACKEND_IMAGE=${backend_image}
            FRONTEND_IMAGE=${frontend_image}
            EOF

            if [ -f secrets/youtube-cookies.txt ]; then
              echo 'APP_IMPORT_YOUTUBE_COOKIES_FILE=/run/secrets/youtube-cookies.txt' >> .env
            fi

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u cyprienj --password-stdin

            docker network inspect proxy >/dev/null
            docker compose -p blindtest-prod config --quiet
            docker compose -p blindtest-prod pull
            if [ -f secrets/youtube-cookies.txt ]; then
              backend_uid="$(docker run --rm --entrypoint id \
                "${backend_image}" -u blindtest)"
              sudo chown "${backend_uid}" secrets/youtube-cookies.txt
              sudo chmod 400 secrets/youtube-cookies.txt
            fi
            docker compose -p blindtest-prod up -d --force-recreate minio
            docker compose -p blindtest-prod up -d --force-recreate minio-init
            docker compose -p blindtest-prod wait minio-init
            docker compose -p blindtest-prod up -d --remove-orphans backend frontend
            docker image prune -f
