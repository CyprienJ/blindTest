name: Deploy — Production

on:
  workflow_dispatch:

env:
  BACKEND_IMAGE: ghcr.io/cyprienj/blindtest-backend
  FRONTEND_IMAGE: ghcr.io/cyprienj/blindtest-frontend

jobs:

  # ── 1. Build & push images to GHCR ────────────────────────────────
  build-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:prod
            ${{ env.BACKEND_IMAGE }}:prod-${{ github.sha }}
          cache-from: type=gha,scope=backend-prod
          cache-to:   type=gha,scope=backend-prod,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:prod
            ${{ env.FRONTEND_IMAGE }}:prod-${{ github.sha }}
          cache-from: type=gha,scope=frontend-prod
          cache-to:   type=gha,scope=frontend-prod,mode=max

  # ── 2. Deploy on the server ────────────────────────────────────────
  deploy:
    name: Deploy to nosblindtests.fr
    runs-on: ubuntu-latest
    needs: build-push
    environment: production

    steps:
      - name: Checkout (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          source:   docker-compose.yml
          target:   /opt/blindtest/prod

      - name: Write .env, pull images and restart
        uses: appleboy/ssh-action@v1
        env:
          POSTGRES_PASSWORD:              ${{ secrets.PROD_POSTGRES_PASSWORD }}
          JWT_SECRET:                     ${{ secrets.PROD_JWT_SECRET }}
          RESEND_API_KEY:                 ${{ secrets.PROD_RESEND_API_KEY }}
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.PROD_CLOUDFLARE_TURNSTILE_SECRET_KEY }}
          GHCR_TOKEN:                     ${{ secrets.GHCR_TOKEN }}
        with:
          host:     ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          envs:     POSTGRES_PASSWORD,JWT_SECRET,RESEND_API_KEY,CLOUDFLARE_TURNSTILE_SECRET_KEY,GHCR_TOKEN
          script: |
            set -e
            cd /opt/blindtest/prod

            # Write production .env from secrets
            cat > .env << EOF
            POSTGRES_DB=blindtest_prod
            POSTGRES_USER=blindtest_prod
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            RESEND_API_KEY=${RESEND_API_KEY}
            CLOUDFLARE_TURNSTILE_SECRET_KEY=${CLOUDFLARE_TURNSTILE_SECRET_KEY}
            APP_BASE_URL=https://nosblindtests.fr
            APP_PORT=8090
            BACKEND_IMAGE=ghcr.io/cyprienj/blindtest-backend:prod
            FRONTEND_IMAGE=ghcr.io/cyprienj/blindtest-frontend:prod
            EOF

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u cyprienj --password-stdin

            docker compose -p blindtest-prod pull
            docker compose -p blindtest-prod up -d --remove-orphans
            docker image prune -f
