name: Build — Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BACKEND_IMAGE: ghcr.io/cyprienj/blindtest-backend
  FRONTEND_IMAGE: ghcr.io/cyprienj/blindtest-frontend
  IMAGE_TAG: main-${{ github.sha }}

jobs:
  build-push:
    name: Build, scan and publish Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend-main
          cache-to: type=gha,scope=backend-main,mode=max

      - name: Publish backend image
        run: docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend-main
          cache-to: type=gha,scope=frontend-main,mode=max

      - name: Publish frontend image
        run: docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}"
