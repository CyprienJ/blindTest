name: CI

on:
  pull_request:
    branches: [main]

jobs:
  security:
    name: Security — Secrets and Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

  backend:
    name: Backend — Checkstyle & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Checkstyle
        working-directory: backend
        run: mvn --batch-mode checkstyle:check

      - name: Tests and coverage
        if: always()
        working-directory: backend
        run: mvn --batch-mode test

      - name: Build and smoke-test runtime import dependencies
        working-directory: backend
        run: docker build --target runtime-dependencies --tag blindtest-backend-runtime-smoke .

      - name: Finalize coverage report
        if: ${{ always() && hashFiles('backend/target/jacoco.exec') != '' }}
        working-directory: backend
        run: mvn --batch-mode jacoco:report

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: |
            backend/target/site/jacoco/
            backend/target/jacoco.exec
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend — Lint, Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm run test -- --watch=false --browsers=ChromeHeadless
