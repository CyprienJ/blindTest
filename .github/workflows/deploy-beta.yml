name: Deploy — Beta

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing GHCR image tag to deploy, for example main-<commit-sha>"
        required: true
        type: string

env:
  BACKEND_IMAGE: ghcr.io/cyprienj/blindtest-backend
  FRONTEND_IMAGE: ghcr.io/cyprienj/blindtest-frontend
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  # ── Deploy an existing, already scanned image on the server ───────
  deploy:
    name: Deploy to beta.nosblindtests.fr
    runs-on: ubuntu-latest
    environment: beta

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v6

      - name: Remove stale MinIO init directory
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            stale_path=/opt/blindtest/beta/infra/minio/init.sh
            if [ -d "$stale_path" ]; then
              rmdir -- "$stale_path"
            fi

      - name: Copy Compose and MinIO init script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          source:   docker-compose.yml,infra/minio/init.sh
          target:   /opt/blindtest/beta

      - name: Write .env, pull images and restart
        uses: appleboy/ssh-action@v1
        env:
          POSTGRES_PASSWORD:              ${{ secrets.BETA_POSTGRES_PASSWORD }}
          JWT_SECRET:                     ${{ secrets.BETA_JWT_SECRET }}
          RESEND_API_KEY:                 ${{ secrets.BETA_RESEND_API_KEY }}
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.BETA_CLOUDFLARE_TURNSTILE_SECRET_KEY }}
          S3_ACCESS_KEY:                  ${{ secrets.BETA_S3_ACCESS_KEY }}
          S3_SECRET_KEY:                  ${{ secrets.BETA_S3_SECRET_KEY }}
          GHCR_TOKEN:                     ${{ secrets.GHCR_TOKEN }}
        with:
          host:     ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          envs:     POSTGRES_PASSWORD,JWT_SECRET,RESEND_API_KEY,CLOUDFLARE_TURNSTILE_SECRET_KEY,S3_ACCESS_KEY,S3_SECRET_KEY,IMAGE_TAG,GHCR_TOKEN
          script: |
            set -e
            cd /opt/blindtest/beta
            test -f infra/minio/init.sh

            # Write beta .env from secrets
            cat > .env << EOF
            POSTGRES_DB=blindtest_beta
            POSTGRES_USER=blindtest_beta
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            RESEND_API_KEY=${RESEND_API_KEY}
            CLOUDFLARE_TURNSTILE_SECRET_KEY=${CLOUDFLARE_TURNSTILE_SECRET_KEY}
            S3_ENDPOINT=http://minio:9000
            S3_PUBLIC_ENDPOINT=https://media.nosblindtests.fr
            S3_REGION=us-east-1
            S3_BUCKET=blindtest-media
            S3_ACCESS_KEY=${S3_ACCESS_KEY}
            S3_SECRET_KEY=${S3_SECRET_KEY}
            APP_BASE_URL=https://beta.nosblindtests.fr
            APP_PORT=8091
            BACKEND_IMAGE=ghcr.io/cyprienj/blindtest-backend:${IMAGE_TAG}
            FRONTEND_IMAGE=ghcr.io/cyprienj/blindtest-frontend:${IMAGE_TAG}
            EOF

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u cyprienj --password-stdin

            docker compose -p blindtest-beta pull
            docker compose -p blindtest-beta up -d --remove-orphans
            docker image prune -f
