name: Deploy — Beta

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BACKEND_IMAGE: ghcr.io/cyprienj/blindtest-backend
  FRONTEND_IMAGE: ghcr.io/cyprienj/blindtest-frontend
  IMAGE_TAG: beta-${{ github.sha }}

jobs:

  # ── 1. Build & push images to GHCR ────────────────────────────────
  build-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend-beta
          cache-to:   type=gha,scope=backend-beta,mode=max

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Publish backend image
        run: docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend-beta
          cache-to:   type=gha,scope=frontend-beta,mode=max

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Publish frontend image
        run: docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}"

  # ── 2. Deploy on the server ────────────────────────────────────────
  deploy:
    name: Deploy to beta.nosblindtests.fr
    runs-on: ubuntu-latest
    needs: build-push
    environment: beta

    steps:
      - name: Checkout (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          source:   docker-compose.yml
          target:   /opt/blindtest/beta

      - name: Write .env, pull images and restart
        uses: appleboy/ssh-action@v1
        env:
          POSTGRES_PASSWORD:              ${{ secrets.BETA_POSTGRES_PASSWORD }}
          JWT_SECRET:                     ${{ secrets.BETA_JWT_SECRET }}
          RESEND_API_KEY:                 ${{ secrets.BETA_RESEND_API_KEY }}
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.BETA_CLOUDFLARE_TURNSTILE_SECRET_KEY }}
          GHCR_TOKEN:                     ${{ secrets.GHCR_TOKEN }}
        with:
          host:     ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          envs:     POSTGRES_PASSWORD,JWT_SECRET,RESEND_API_KEY,CLOUDFLARE_TURNSTILE_SECRET_KEY,GHCR_TOKEN
          script: |
            set -e
            cd /opt/blindtest/beta

            # Write beta .env from secrets
            cat > .env << EOF
            POSTGRES_DB=blindtest_beta
            POSTGRES_USER=blindtest_beta
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            RESEND_API_KEY=${RESEND_API_KEY}
            CLOUDFLARE_TURNSTILE_SECRET_KEY=${CLOUDFLARE_TURNSTILE_SECRET_KEY}
            APP_BASE_URL=https://beta.nosblindtests.fr
            APP_PORT=8091
            BACKEND_IMAGE=ghcr.io/cyprienj/blindtest-backend:${IMAGE_TAG}
            FRONTEND_IMAGE=ghcr.io/cyprienj/blindtest-frontend:${IMAGE_TAG}
            EOF

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u cyprienj --password-stdin

            docker compose -p blindtest-beta pull
            docker compose -p blindtest-beta up -d --remove-orphans
            docker image prune -f
