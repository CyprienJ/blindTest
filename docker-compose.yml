services:
  postgres:
    image: postgres:16
    container_name: blindtest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blindtest}
      POSTGRES_USER: ${POSTGRES_USER:-blindtest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blindtest}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-blindtest} -d $${POSTGRES_DB:-blindtest}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media:
