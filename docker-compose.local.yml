# Local browser development override.
#
# Cloudflare recommends its public test key pair on localhost. Keeping this in a
# separate Compose file prevents test credentials and the development Spring
# profile from being used by production deployments.
services:
  minio:
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:${APP_PORT:-8090}

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: development
      APP_BASE_URL: http://localhost:${APP_PORT:-8090}
      CORS_ALLOWED_ORIGINS: http://localhost:${APP_PORT:-8090}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

  frontend:
    build:
      args:
        ANGULAR_CONFIGURATION: development

networks:
  proxy:
    name: blindtest_proxy
    external: false
