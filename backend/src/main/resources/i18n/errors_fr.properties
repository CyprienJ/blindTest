# Messages d'erreur REST (français), indexés par ApiErrorCode. Le texte anglais de l'énumération
# sert de repli. Ces messages n'ont pas d'arguments : les apostrophes sont simples.
error.VALIDATION_FAILED=La validation de la requête a échoué
error.MALFORMED_REQUEST=Le corps de la requête est mal formé
error.INVALID_PARAMETER=Un paramètre de la requête est invalide
error.INVALID_OR_EXPIRED_TOKEN=Le jeton est invalide ou expiré
error.INVITATION_INVALID=L'invitation est invalide, expirée ou déjà utilisée
error.AUTHENTICATION_REQUIRED=Une authentification est requise
error.INVALID_ACCESS_TOKEN=Le jeton d'accès est invalide ou expiré
error.INVALID_CREDENTIALS=Identifiants invalides
error.INVALID_REFRESH_TOKEN=Le jeton de rafraîchissement est invalide ou expiré
error.ACCESS_DENIED=Accès refusé
error.EMAIL_NOT_VERIFIED=L'adresse email n'est pas vérifiée
error.TURNSTILE_FAILED=La vérification anti-robot a échoué
error.RESOURCE_NOT_FOUND=Ressource introuvable
error.METHOD_NOT_ALLOWED=La méthode HTTP n'est pas autorisée
error.EMAIL_TAKEN=Cette adresse email est déjà enregistrée
error.USERNAME_TAKEN=Ce nom d'utilisateur est déjà pris
error.CONFLICT=La requête est en conflit avec l'état actuel
error.INVITATION_ALREADY_ACCEPTED=L'invitation a déjà été acceptée
error.ADMIN_SELF_CHANGE_FORBIDDEN=Un administrateur ne peut pas supprimer son propre compte ni modifier son propre rôle
error.USER_OWNS_PLAYLISTS=Supprimez les playlists de cet utilisateur avant de supprimer l'utilisateur
error.ANSWER_ALIAS_DUPLICATE=Cet alias de réponse existe déjà
error.TRACK_EXCERPT_INVALID=La fenêtre d'extrait ne tient pas dans l'audio jouable
error.TRACK_METADATA_INCOMPLETE=Les métadonnées du titre sont incomplètes
error.IMPORT_ALREADY_ACTIVE=Un import est déjà en cours pour cette vidéo YouTube
error.IMPORT_FILE_TOO_LARGE=Le fichier envoyé dépasse la taille maximale autorisée
error.IMPORT_FILE_UNSUPPORTED=Le fichier envoyé n'est pas un fichier audio pris en charge
error.IMPORT_AUDIO_TOO_LONG=L'audio envoyé dépasse la durée maximale
error.IMPORT_METADATA_REQUIRED=Le titre et l'artiste sont requis quand le fichier n'a pas de tags intégrés
error.COVER_SUGGESTION_EXPIRED=La suggestion de pochette a expiré ; relancez la recherche
error.COVER_IMAGE_TOO_LARGE=L'image de pochette dépasse 5 Mo
error.COVER_IMAGE_UNSUPPORTED=La pochette doit être une image JPEG, PNG ou WebP
error.COVER_IMAGE_UNAVAILABLE=L'image de pochette n'a pas pu être téléchargée
error.PLAYLIST_ORDER_INVALID=L'ordre de la playlist doit contenir chaque titre exactement une fois
error.PLAYLIST_TRACK_DUPLICATE=Ce titre est déjà dans la playlist
error.PLAYLIST_TRACK_NOT_PUBLISHED=Seuls les titres publiés peuvent être ajoutés aux playlists
error.GAME_CONFIGURATION_REQUIRED=Une configuration de partie est requise
error.GAME_PLAYLIST_REQUIRED=Une playlist doit être sélectionnée
error.GAME_TRACK_COUNT_INVALID=Le nombre de titres demandé est invalide
error.GAME_ROUND_DURATION_INVALID=La durée maximale de manche est invalide
error.GAME_CONFIGURATION_EXTENSION_UNSUPPORTED=L'option de partie demandée n'est pas prise en charge
error.GAME_PLAYLIST_NOT_FOUND=La playlist sélectionnée n'est pas disponible
error.GAME_PLAYLIST_INELIGIBLE=La playlist sélectionnée n'a aucun titre éligible
error.GAME_PLAYLIST_INSUFFICIENT_TRACKS=La playlist sélectionnée ne contient pas assez de titres éligibles
error.GAME_DIFFICULTY_INVALID=Sélectionnez au moins un niveau de difficulté entre 1 et 5
error.GAME_DIFFICULTY_INSUFFICIENT_TRACKS=Les niveaux de difficulté sélectionnés ne contiennent pas assez de titres éligibles
error.LOBBY_NOT_FOUND=Ce code de salon est invalide ou le salon n'est plus ouvert
error.LOBBY_FULL=Ce salon est complet
error.LOBBY_HOST_REQUIRED=Seul l'hôte du salon peut faire cela
error.LOBBY_NOT_READY=Il faut au moins deux joueurs et que chaque invité soit prêt
error.LOBBY_PARTICIPANT_NOT_FOUND=Ce joueur n'est pas dans le salon
error.UNSUPPORTED_MEDIA_TYPE=Ce type de média n'est pas pris en charge
error.INTERNAL_ERROR=Une erreur inattendue est survenue
