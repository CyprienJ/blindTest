spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/blindtest}
spring.datasource.username=${DATASOURCE_USERNAME:blindtest}
spring.datasource.password=${DATASOURCE_PASSWORD:blindtest}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

# JWT_SECRET must be at least 32 ASCII characters (256 bits) for HS256.
jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production!!}
