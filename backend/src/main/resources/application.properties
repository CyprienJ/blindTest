spring.profiles.default=development

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Include the request ID populated by CorrelationIdFilter in every application log line.
logging.pattern.correlation=[requestId=%X{requestId:-}]\u0020

# Expose only aggregate operational data. SecurityConfig restricts metrics to administrators.
management.endpoints.web.exposure.include=health,metrics

# Sliding active-session inactivity and short terminal-state retention boundaries.
app.session.inactive-ttl=30m
app.session.finished-ttl=5m
app.session.cleanup-delay=PT1M
