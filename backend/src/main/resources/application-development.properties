# Local-only defaults. Production values live in application-production.properties and have no fallback.
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/blindtest}
spring.datasource.username=${DATASOURCE_USERNAME:blindtest}
spring.datasource.password=${DATASOURCE_PASSWORD:blindtest}

jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production!!}
jwt.access-token.ttl-ms=${JWT_ACCESS_TOKEN_TTL_MS:900000}
jwt.email-verification.ttl-ms=${JWT_EMAIL_VERIFICATION_TTL_MS:86400000}
jwt.password-reset.ttl-ms=${JWT_PASSWORD_RESET_TTL_MS:3600000}
jwt.refresh-token.ttl-ms=${JWT_REFRESH_TOKEN_TTL_MS:604800000}

resend.api-key=${RESEND_API_KEY:re_development_key}
cloudflare.turnstile.secret-key=${CLOUDFLARE_TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}

app.base-url=${APP_BASE_URL:http://localhost:4200}
app.media-dir=${APP_MEDIA_DIR:/media}
app.import.temp-dir=${APP_IMPORT_TEMP_DIR:/tmp/blindtest-imports}
app.import.max-size-bytes=${APP_IMPORT_MAX_SIZE_BYTES:26214400}
app.import.timeout=${APP_IMPORT_TIMEOUT:10m}
app.import.youtube-cookies-file=${APP_IMPORT_YOUTUBE_COOKIES_FILE:}
app.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:9000}
app.s3.region=${S3_REGION:us-east-1}
app.s3.bucket=${S3_BUCKET:blindtest-media}
app.s3.access-key=${S3_ACCESS_KEY:minioadmin}
app.s3.secret-key=${S3_SECRET_KEY:minioadmin}
app.s3.presigned-url-ttl=${S3_PRESIGNED_URL_TTL:5m}
app.media-maintenance.deletion-poll-delay-ms=${MEDIA_DELETION_POLL_DELAY_MS:30000}
