# Isolated full-stack Compose environment (E2E-01). Every value below is a deterministic,
# test-only default; docker-compose.test.yml sets the real values explicitly. Never set
# SPRING_PROFILES_ACTIVE=e2e outside that Compose file — see E2eAdaptersConfig and
# E2eTestSupportController, which only activate under this profile.
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/blindtest_e2e}
spring.datasource.username=${DATASOURCE_USERNAME:blindtest_e2e}
spring.datasource.password=${DATASOURCE_PASSWORD:blindtest_e2e}

jwt.secret=${JWT_SECRET:e2e-test-only-jwt-secret-do-not-use-in-prod!!}
jwt.access-token.ttl-ms=${JWT_ACCESS_TOKEN_TTL_MS:900000}
jwt.email-verification.ttl-ms=${JWT_EMAIL_VERIFICATION_TTL_MS:86400000}
jwt.password-reset.ttl-ms=${JWT_PASSWORD_RESET_TTL_MS:3600000}
jwt.refresh-token.ttl-ms=${JWT_REFRESH_TOKEN_TTL_MS:604800000}

# Never called: FakeEmailSender replaces EmailService under this profile.
resend.api-key=${RESEND_API_KEY:re_e2e_test_key}
# Cloudflare's documented always-pass test secret, paired with the equivalent test site key
# compiled into the frontend's "development" Angular build. Rejected outright in production
# by ProductionConfigurationValidator.
cloudflare.turnstile.secret-key=${CLOUDFLARE_TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}

app.base-url=${APP_BASE_URL:http://frontend}
app.media-dir=${APP_MEDIA_DIR:/media}
app.import.temp-dir=${APP_IMPORT_TEMP_DIR:/tmp/blindtest-e2e-imports}
app.import.max-size-bytes=${APP_IMPORT_MAX_SIZE_BYTES:26214400}
app.import.timeout=${APP_IMPORT_TIMEOUT:10m}
app.import.youtube-cookies-file=${APP_IMPORT_YOUTUBE_COOKIES_FILE:}
app.s3.endpoint=${S3_ENDPOINT:http://minio-test:9000}
app.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:http://minio-test:9000}
app.s3.region=${S3_REGION:us-east-1}
app.s3.bucket=${S3_BUCKET:blindtest-e2e-media}
app.s3.access-key=${S3_ACCESS_KEY:blindtest_e2e}
app.s3.secret-key=${S3_SECRET_KEY:blindtest_e2e}
app.s3.presigned-url-ttl=${S3_PRESIGNED_URL_TTL:5m}
app.media-maintenance.deletion-poll-delay-ms=${MEDIA_DELETION_POLL_DELAY_MS:5000}
