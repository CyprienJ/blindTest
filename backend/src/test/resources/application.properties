spring.profiles.active=test
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=dev-secret-key-change-in-production!!
jwt.access-token.ttl-ms=900000
jwt.email-verification.ttl-ms=86400000
jwt.password-reset.ttl-ms=3600000
jwt.refresh-token.ttl-ms=604800000

app.base-url=https://nosblindtests.fr
app.media-dir=/media
app.import.temp-dir=/tmp/blindtest-test-imports
app.import.max-size-bytes=26214400
app.import.timeout=10m
app.import.youtube-cookies-file=
app.s3.endpoint=http://localhost:9000
app.s3.public-endpoint=https://media.example.test
app.s3.region=us-east-1
app.s3.bucket=blindtest-test
app.s3.access-key=test-access-key
app.s3.secret-key=test-secret-key
app.s3.presigned-url-ttl=5m
resend.api-key=re_test_key
cloudflare.turnstile.secret-key=1x0000000000000000000000000000000AA

spring.messages.basename=i18n/emails,i18n/errors
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
