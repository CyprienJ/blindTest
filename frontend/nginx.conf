server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Compress text assets. Proxied API responses stay uncompressed: they can carry
    # tokens next to request-controlled text (BREACH).
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    # Angular SPA — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry document names the current hashed bundles, so browsers must
    # revalidate it to pick up a new release.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Build output carries a content hash in its file name (outputHashing: all),
    # so a given URL never changes and can be cached for a year.
    location ~* \.(?:js|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Audio files served directly from the shared volume (more efficient than proxying)
    location /media/ {
        alias /media/;
        include /etc/nginx/snippets/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Backend REST API
    location /api/ {
        gzip               off;
        proxy_pass         http://backend:8080/api/;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Admin audio upload: the only endpoint accepting a large body. Keep the
    # limit aligned with spring.servlet.multipart.max-request-size (26 MiB).
    # The TLS-terminating host proxy needs an equal or larger limit too.
    location = /api/admin/tracks/import/upload {
        client_max_body_size 26m;
        gzip               off;
        proxy_pass         http://backend:8080/api/admin/tracks/import/upload;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Admin cover upload: images up to 5 MB (CoverHttpClient.MAX_IMAGE_BYTES)
    # plus multipart overhead. Every other endpoint keeps the 1 MiB default.
    location = /api/admin/cover-suggestions/upload {
        client_max_body_size 6m;
        gzip               off;
        proxy_pass         http://backend:8080/api/admin/cover-suggestions/upload;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Native WebSocket endpoint (STOMP / @stomp/rx-stomp)
    location /ws {
        proxy_pass             http://backend:8080/ws;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $http_host;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
    }

    # SockJS fallback endpoint
    location /ws-sockjs/ {
        proxy_pass             http://backend:8080/ws-sockjs/;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $http_host;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
    }

    # Liveness probe (used by uptime monitors / load balancers)
    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        access_log off;
    }
}
