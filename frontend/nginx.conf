server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Audio files served directly from the shared volume (more efficient than proxying)
    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Backend REST API
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Native WebSocket endpoint (STOMP / @stomp/rx-stomp)
    location /ws {
        proxy_pass             http://backend:8080/ws;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
    }

    # SockJS fallback endpoint
    location /ws-sockjs/ {
        proxy_pass             http://backend:8080/ws-sockjs/;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
    }

    # Liveness probe (used by uptime monitors / load balancers)
    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        access_log off;
    }
}
