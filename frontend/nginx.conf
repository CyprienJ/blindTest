server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Browser-facing baseline. HSTS is configured by the TLS-terminating host
    # proxy in production, so this HTTP container does not emit it locally.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' ws: wss: https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: https:;" always;

    # Angular SPA — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Audio files served directly from the shared volume (more efficient than proxying)
    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Backend REST API
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Admin audio upload: the only endpoint accepting a large body. Keep the
    # limit aligned with spring.servlet.multipart.max-request-size (26 MiB).
    # The TLS-terminating host proxy needs an equal or larger limit too.
    location = /api/admin/tracks/import/upload {
        client_max_body_size 26m;
        proxy_pass         http://backend:8080/api/admin/tracks/import/upload;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Native WebSocket endpoint (STOMP / @stomp/rx-stomp)
    location /ws {
        proxy_pass             http://backend:8080/ws;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $http_host;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
    }

    # SockJS fallback endpoint
    location /ws-sockjs/ {
        proxy_pass             http://backend:8080/ws-sockjs/;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $http_host;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
    }

    # Liveness probe (used by uptime monitors / load balancers)
    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        access_log off;
    }
}
