<div class="join-screen">
  <section class="bt-card join-card" aria-labelledby="join-title">
    <span class="eyebrow">Multiplayer blindtest</span>
    <h1 id="join-title">Join a session</h1>
    <p class="subtitle">Enter the 6-character code your host shared.</p>

    <div class="code-cells" role="group" aria-label="Session code">
      @for (index of positions; track index) {
        <input
          #cell
          class="mono"
          [class.filled]="!!characters[index]"
          [value]="characters[index]"
          [attr.aria-label]="'Code character ' + (index + 1) + ' of ' + positions.length"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          inputmode="text"
          maxlength="6"
          (input)="onInput(index, $event)"
          (keydown)="onKeydown(index, $event)"
          (paste)="onPaste(index, $event)"
        />
      }
    </div>

    @if (errorMessage) {
      <p class="notice error" role="alert">{{ errorMessage }}</p>
    }

    <button
      class="bt-btn bt-btn-primary bt-btn-lg"
      type="button"
      [disabled]="missing > 0 || joining"
      (click)="join()"
    >
      @if (joining) {
        Joining…
      } @else if (missing > 0) {
        Enter {{ missing }} more character{{ missing === 1 ? '' : 's' }}
      } @else {
        Join lobby →
      }
    </button>

    <p class="footer">
      Don't have a code?
      <a routerLink="/lobby/create" [queryParams]="{ mode: 'multiplayer' }">Host your own</a>
    </p>
  </section>
</div>
