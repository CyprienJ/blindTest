<div class="join-screen">
  <section class="bt-card join-card" aria-labelledby="join-title">
    <span i18n class="eyebrow">Multiplayer blindtest</span>
    <h1 i18n id="join-title">Join a session</h1>
    <p i18n class="subtitle">Enter the 6-character code your host shared.</p>

    <div class="code-cells" role="group" i18n-aria-label aria-label="Session code">
      @for (index of positions; track index) {
        <input
          #cell
          class="mono"
          [class.filled]="!!characters[index]"
          [value]="characters[index]"
          [attr.aria-label]="cellLabel(index)"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          inputmode="text"
          maxlength="6"
          (input)="onInput(index, $event)"
          (keydown)="onKeydown(index, $event)"
          (paste)="onPaste(index, $event)"
        />
      }
    </div>

    @if (errorMessage) {
      <p class="notice error" role="alert">{{ errorMessage }}</p>
    }

    <button
      class="bt-btn bt-btn-primary bt-btn-lg"
      type="button"
      [disabled]="missing > 0 || joining"
      (click)="join()"
    >
      @if (joining) {
        <ng-container i18n>Joining…</ng-container>
      } @else if (missing > 0) {
        <ng-container i18n>{missing, plural,
          =1 {Enter 1 more character}
          other {Enter {{ missing }} more characters}
        }</ng-container>
      } @else {
        <ng-container i18n>Join lobby →</ng-container>
      }
    </button>

    <p class="footer">
      <ng-container i18n>Don't have a code?</ng-container>
      <a i18n routerLink="/lobby/create" [queryParams]="{ mode: 'multiplayer' }">Host your own</a>
    </p>
  </section>
</div>
