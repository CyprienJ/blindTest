<div class="bt-screen">
  <header class="bt-topbar">
    <div class="bt-topbar-lead">
      <a class="bt-logo" routerLink="/home" aria-label="Blindtest home">
        <span class="bt-logo-mark" aria-hidden="true"></span>
        <span>Blindtest</span>
      </a>
      <nav class="bt-nav" aria-label="Primary navigation">
        <a routerLink="/lobby/create" routerLinkActive="active" ariaCurrentWhenActive="page"
          >Play</a
        >
        <a routerLink="/lobby/create" fragment="public-playlists">Playlists</a>
        <span class="bt-nav-item is-disabled" aria-disabled="true" title="Available soon">
          Friends
        </span>
        <span class="bt-nav-item is-disabled" aria-disabled="true" title="Available soon">
          History
        </span>
        @if ((currentUser$ | async)?.role === 'ADMIN') {
          <a routerLink="/admin" routerLinkActive="active" ariaCurrentWhenActive="page">Admin</a>
        }
      </nav>
    </div>

    @if (currentUser$ | async; as user) {
      <div class="bt-topbar-account">
        <span class="bt-avatar" aria-hidden="true">{{ initials(user.username) }}</span>
        <span class="bt-account-name">{{ user.username }}</span>
        <button
          type="button"
          class="bt-btn bt-btn-ghost bt-btn-sm"
          [disabled]="signingOut"
          (click)="signOut()"
        >
          {{ signingOut ? 'Signing out…' : 'Sign out' }}
        </button>
      </div>
    }
  </header>

  <router-outlet />
</div>
