        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Admin - Playlists]
      summary: Update playlist metadata
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaylistRequest'
      responses:
        '200':
          description: Updated playlist
          content:
            application/json:
