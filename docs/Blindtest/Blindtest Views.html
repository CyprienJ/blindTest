<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Blindtest — Views</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { height: 100%; margin: 0; background: oklch(0.12 0.005 70); color: var(--fg-0); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="views/shared.jsx"></script>
<script type="text/babel" src="views/auth.jsx"></script>
<script type="text/babel" src="views/lobby.jsx"></script>
<script type="text/babel" src="views/game.jsx"></script>
<script type="text/babel" src="views/profile.jsx"></script>
<script type="text/babel" src="views/admin.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

// Standard desktop artboard size
const W = 1280, H = 800;
const Wn = 480, Hn = 760;  // narrow (auth)

function App() {
  return (
    <DesignCanvas title="Blindtest — All views" subtitle="Generated from docs/architecture.md · 18 screens">
      <DCSection id="auth" title="Auth" subtitle="Registration with Cloudflare Turnstile, login, email verification, password reset">
        <DCArtboard id="login" label="Login" width={Wn} height={Hn}><LoginView /></DCArtboard>
        <DCArtboard id="register" label="Register · Turnstile" width={Wn} height={Hn}><RegisterView /></DCArtboard>
        <DCArtboard id="verify" label="Verify email" width={Wn} height={Hn}><VerifyEmailView /></DCArtboard>
        <DCArtboard id="forgot" label="Forgot password" width={Wn} height={Hn}><ForgotPasswordView /></DCArtboard>
      </DCSection>

      <DCSection id="lobby" title="Lobby" subtitle="Joining by code or creating a configured session, then waiting in the lobby room">
        <DCArtboard id="join" label="Join session" width={Wn} height={Hn}><JoinSessionView /></DCArtboard>
        <DCArtboard id="create" label="Create session · rules" width={W} height={H}><CreateSessionView /></DCArtboard>
        <DCArtboard id="lobbyroom" label="Lobby room · friend invite" width={W} height={H}><LobbyRoomView /></DCArtboard>
      </DCSection>

      <DCSection id="game" title="Game" subtitle="Synchronised playback, answer form, live scoreboard — through to final standings">
        <DCArtboard id="playing" label="Round · PLAYING" width={W} height={H}><GameRoomView revealed={false} /></DCArtboard>
        <DCArtboard id="revealed" label="Round · REVEALED" width={W} height={H}><GameRoomView revealed={true} /></DCArtboard>
        <DCArtboard id="end" label="End screen" width={W} height={H}><EndScreenView /></DCArtboard>
      </DCSection>

      <DCSection id="profile" title="Profile & social" subtitle="Account, history, game replay, friends, requests, notification toasts">
        <DCArtboard id="me" label="My profile" width={W} height={H}><MyProfileView /></DCArtboard>
        <DCArtboard id="history" label="Game history" width={W} height={H}><GameHistoryView /></DCArtboard>
        <DCArtboard id="gamedetail" label="Game detail" width={W} height={H}><GameDetailView /></DCArtboard>
        <DCArtboard id="friends" label="Friends" width={W} height={H}><FriendsView /></DCArtboard>
        <DCArtboard id="requests" label="Friend requests + toasts" width={W} height={H}><FriendRequestsView /></DCArtboard>
      </DCSection>

      <DCSection id="admin" title="Admin" subtitle="Catalogue, YouTube imports with live pipeline, playlist editor, user management">
        <DCArtboard id="catalogue" label="Track catalogue" width={W} height={H}><AdminTracksView /></DCArtboard>
        <DCArtboard id="import" label="Import · pipeline + preview" width={W} height={H}><AdminImportView /></DCArtboard>
        <DCArtboard id="playlist" label="Playlist editor" width={W} height={H}><AdminPlaylistView /></DCArtboard>
        <DCArtboard id="users" label="User management" width={W} height={H}><AdminUsersView /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
